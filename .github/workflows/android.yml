# 안드로이드 태블릿판 APK 빌드 — android/ 이 바뀌거나 수동 실행 시
name: android-apk
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml', 'js/**', '*.html', 'css/**', 'assembly/**', 'assets/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: APK 빌드
        run: gradle -p android assembleRelease --no-daemon
      - name: 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk neobot-tablet.apk
      - uses: actions/upload-artifact@v4
        with: { name: neobot-tablet-apk, path: neobot-tablet.apk, retention-days: 30 }
      # 작업 브랜치(claude/…)에서는 APK를 download/ 에 커밋 → 병합하면 사이트에서 바로 내려받기
      - name: APK를 download/ 에 올리기
        if: github.event_name == 'push' && startsWith(github.ref_name, 'claude/')
        run: |
          mkdir -p download && cp neobot-tablet.apk download/neobot-tablet.apk
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add download/neobot-tablet.apk
          git commit -m "태블릿 APK 빌드 결과" || exit 0
          git push
