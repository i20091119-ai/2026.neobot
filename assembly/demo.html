<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>네오봇 조립도</title>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js"}}</script>
<style>
 body{margin:0;font-family:'Malgun Gothic',sans-serif;display:grid;grid-template-columns:360px 1fr;height:100vh}
 #side{padding:20px;border-right:1px solid #ddd;overflow:auto}
 #view{position:relative}
 .no{display:inline-flex;width:44px;height:44px;border-radius:50%;background:#16a3a3;color:#fff;font-weight:700;font-size:22px;align-items:center;justify-content:center}
 h2{display:inline;margin-left:10px;font-size:24px}
 .parts{background:#e8f5f5;border-radius:14px;padding:12px;margin:16px 0}
 .part{display:flex;align-items:center;gap:12px;margin:6px 0} .part img{width:90px;height:70px;object-fit:contain;background:#fff;border-radius:8px}
 .part b{color:#16a3a3;font-size:20px} ol{padding-left:22px;line-height:1.7}
 .nav{display:flex;gap:10px;margin-top:20px} .nav button{flex:1;font-size:18px;padding:12px;border-radius:12px;border:0;background:#16a3a3;color:#fff}
 .nav button:disabled{opacity:.4}
</style></head>
<body>
<div id="side"><div><span class="no" id="no">1</span><h2 id="title"></h2></div>
 <div class="parts" id="parts"></div><ol id="lines"></ol>
 <div class="nav"><button id="prev">◀ 이전</button><button id="next">다음 ▶</button></div>
 <p style="color:#888;font-size:13px">마우스로 돌려 보기 · 휠로 확대</p></div>
<div id="view"></div>
<script type="module">
import { createAssemblyViewer } from './assembly-viewer.js';
const $ = id => document.getElementById(id);
const v = await createAssemblyViewer($('view'), { base: './', onStep: (i, st, n) => {
  $('no').textContent = i + 1; $('title').textContent = st.title;
  $('parts').innerHTML = st.parts.length ? st.parts.map(p => `<div class="part"><img src="thumbs/${p.key}.png"><div>${p.name}<br><b>× ${p.count}</b></div></div>`).join('') : '<div style="color:#888">새 부품 없음</div>';
  $('lines').innerHTML = st.lines.map(l => `<li>${l}</li>`).join('');
  $('prev').disabled = i === 0; $('next').disabled = i === n - 1;
}});
$('prev').onclick = () => v.prev(); $('next').onclick = () => v.next();
window.__v = v; window.READY = true;
</script></body></html>
